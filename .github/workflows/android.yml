name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Build web + sync Android
        run: npm run build:android

      - name: Restaurar keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/missao-pf.keystore
          fi

      - name: Gerar APK
        working-directory: android
        env:
          MPF_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MPF_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          if [ -f app/missao-pf.keystore ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Preparar APK
        run: |
          mkdir -p out
          APK=$(ls android/app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          [ -z "$APK" ] && APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          cp "$APK" out/missao-pf.apk

      - uses: actions/upload-artifact@v4
        with:
          name: missao-pf-apk
          path: out/missao-pf.apk
          if-no-files-found: error

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Missão PF 1.0.${{ github.run_number }}
          body: |
            Versão gerada a partir de ${{ github.sha }}.
            Para instalar ou atualizar, baixe o missao-pf.apk abaixo e abra no celular.
          files: out/missao-pf.apk
          make_latest: true
